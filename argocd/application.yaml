
apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: gitops-demo
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/MysticBaghel/gitops-demo.git
    targetRevision: master
    path: k8s

  destination:
    server: https://kubernetes.default.svc
    namespace: gitops-demo

  syncPolicy:
    automated:
      enabled: true
      prune: true
      selfHeal: true
