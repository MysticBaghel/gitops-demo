
apiVersion: apps/v1
kind: Deployment

metadata:
  name: gitops-demo
  namespace: gitops-demo

spec:
  replicas: 2

  selector:
    matchLabels:
      app: gitops-demo

  template:
    metadata:
      labels:
        app: gitops-demo

    spec:
      containers:
        - name: fastapi
          image: baghelgaurav/gitops-demo:sha-b5fee70
          ports:
            - containerPort: 8000
          env:
            - name: OTEL_SERVICE_NAME
              value: "gitops-demo"

            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://jaeger.monitoring.svc.cluster.local:4318"

            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: "http/protobuf"

            - name: OTEL_TRACES_EXPORTER
              value: "otlp"

            - name: OTEL_METRICS_EXPORTER
              value: "none"

            - name: OTEL_LOGS_EXPORTER
              value: "none"
