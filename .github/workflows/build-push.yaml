
name: Build and Deploy GitOps Demo

on:
  push:
    branches:
      - master
    paths:
      - "main.py"
      - "requirements.txt"
      - "Dockerfile"
      - ".github/workflows/build-push.yaml"

permissions:
  contents: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set image tag
        id: vars
        run: echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: baghelgaurav/gitops-demo:${{ steps.vars.outputs.tag }}

      - name: Update Kubernetes deployment image
        run: |
          sed -i "s|image: baghelgaurav/gitops-demo:.*|image: baghelgaurav/gitops-demo:${{ steps.vars.outputs.tag }}|" k8s/deployment.yaml

      - name: Commit deployment update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add k8s/deployment.yaml
          git diff --cached --quiet || git commit -m "chore: deploy image ${{ steps.vars.outputs.tag }}"
          git push
